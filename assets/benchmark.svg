<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 434" width="760" height="434" role="img" aria-label="The Bleep against The Fuck, median of 30 runs"><title>The Bleep against The Fuck</title>
<style>.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;font-size:12.5px}.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:13px}.k{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:11.5px}</style>
<rect width="760" height="434" rx="10" fill="#15181f"/>
<rect x="0.5" y="0.5" width="759" height="433" rx="9.5" fill="none" stroke="#2b313c"/>
<rect x="26" y="21" width="10" height="10" rx="3" fill="#565f70"/>
<text class="k" x="42" y="30" fill="#7d8794">The Fuck 3.32</text>
<rect x="142" y="21" width="10" height="10" rx="3" fill="#5fd38d"/>
<text class="k" x="158" y="30" fill="#c3cad4">The Bleep</text>
<text class="k" x="734" y="30" text-anchor="end" fill="#7d8794">median of 30 runs &#183; each row scaled to The Fuck's time &#183; lower is better</text>
<text class="s" x="26" y="79.5" fill="#c3cad4">Open a shell</text>
<rect x="234" y="55" width="362" height="11" rx="5.5" fill="#565f70"/>
