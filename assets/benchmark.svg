<text class="m" x="309.521" y="80.5" fill="#5fd38d">38 ms</text>
<text class="m" x="734" y="76" text-anchor="end" fill="#ffb454">5.4×</text>
<text class="s" x="26" y="137.5" fill="#c3cad4">Correct a mistyped command</text>
<rect x="234" y="113" width="362" height="11" rx="5.5" fill="#565f70"/>
<text class="m" x="605" y="122.5" fill="#7d8794">240 ms</text>
<rect x="234" y="129" width="86.1224" height="11" rx="5.5" fill="#5fd38d"/>
<text class="m" x="329.122" y="138.5" fill="#5fd38d">57 ms</text>
<text class="m" x="734" y="134" text-anchor="end" fill="#ffb454">4.2×</text>
<text class="s" x="26" y="195.5" fill="#c3cad4">Correct inside a git repository</text>
<rect x="234" y="171" width="362" height="11" rx="5.5" fill="#565f70"/>
<text class="m" x="605" y="180.5" fill="#7d8794">239 ms</text>
<rect x="234" y="187" width="87.7199" height="11" rx="5.5" fill="#5fd38d"/>
<text class="m" x="330.72" y="196.5" fill="#5fd38d">58 ms</text>
<text class="m" x="734" y="192" text-anchor="end" fill="#ffb454">4.1×</text>
<text class="s" x="26" y="253.5" fill="#c3cad4">Correct when nothing matches</text>
<rect x="234" y="229" width="362" height="11" rx="5.5" fill="#565f70"/>
<text class="m" x="605" y="238.5" fill="#7d8794">336 ms</text>
<rect x="234" y="245" width="77.2216" height="11" rx="5.5" fill="#5fd38d"/>
<text class="m" x="320.222" y="254.5" fill="#5fd38d">72 ms</text>
<text class="m" x="734" y="250" text-anchor="end" fill="#ffb454">4.7×</text>
<text class="s" x="26" y="311.5" fill="#c3cad4">Correct a slow command *</text>
<rect x="234" y="287" width="362" height="11" rx="5.5" fill="#565f70"/>
<text class="m" x="605" y="296.5" fill="#7d8794">822 ms</text>
<rect x="234" y="303" width="248.918" height="11" rx="5.5" fill="#5fd38d"/>
<text class="m" x="491.918" y="312.5" fill="#5fd38d">565 ms</text>
<text class="m" x="734" y="308" text-anchor="end" fill="#ffb454">1.5×</text>
<text class="s" x="26" y="369.5" fill="#c3cad4">Correct after 1 MB of output</text>
<rect x="234" y="345" width="362" height="11" rx="5.5" fill="#565f70"/>
<text class="m" x="605" y="354.5" fill="#7d8794">3.25 s</text>
<rect x="234" y="361" width="14.9725" height="11" rx="5.5" fill="#5fd38d"/>
<text class="m" x="257.973" y="370.5" fill="#5fd38d">134 ms</text>
<text class="m" x="734" y="366" text-anchor="end" fill="#ffb454">24.2×</text>
<text class="k" x="26" y="419" fill="#7d8794">* dominated by the half second the command being corrected takes on its own; the rest is what the tool costs you.</text>
