name: OS command inventory

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  hosted-runners:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Capture commands and safe probes
        run: python ci/command_inventory.py --output command-inventory.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: command-inventory-${{ matrix.os }}
          path: command-inventory.json
          if-no-files-found: error

  linux-userlands:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: python:3
            label: python3
          - image: python:3-alpine
            label: python3-alpine
          - image: python:3-slim
            label: python3-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Capture commands and safe probes
        run: |
          docker pull '${{ matrix.image }}'
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP:/out" \
            -w /src \
            '${{ matrix.image }}' \
            python ci/command_inventory.py --output /out/command-inventory.json
          cp "$RUNNER_TEMP/command-inventory.json" command-inventory.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: command-inventory-${{ matrix.label }}
          path: command-inventory.json
          if-no-files-found: error
