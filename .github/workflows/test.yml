name: Tests

# Branches, and not tags. A tag push is a `push` event too, and the concurrency
# group below is keyed on the ref -- so `refs/heads/master` and `refs/tags/4.0.1`
# did not cancel each other and the same commit was tested twice, once when it
# landed and again when it was tagged. Naming `branches` and no `tags` is what
# tells GitHub not to run this for a tag; the tag still gets `release.yml`, which
# builds both artifacts and installs the wheel on all three systems before it
# publishes anything.
on:
  push:
    branches: ['**']
  pull_request:

# Read-only. Nothing here needs to write to the repository, and a pull request
# from a fork must never run with anything more. Publishing is a separate
# workflow with its own permissions; see release.yml.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless, so it is
# stopped rather than left to finish -- which is what frees the runners for the
# push that replaced it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_LATEST: "3.14"

jobs:
  # Every Python on every system. This is a public repository, so the runners are
  # free and they run in parallel -- what matters is the longest single job, not
  # how many there are, and skipping a platform to save a job that costs nothing
  # only buys a coverage hole.
  test:
    name: ${{ matrix.os }} ${{ matrix.python-version }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            setup.py
      - name: Install The Bleep with all dependencies
        run: |
          pip install -Ur requirements.txt
          pip install -e .
      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == env.PYTHON_LATEST
        run: flake8

      # The whole suite, on every one of them. The slow parts of it are the
      # parts most worth running everywhere: the rule pack marshals code
      # objects, which is a per-interpreter format, and the structural checks
      # walk the syntax tree, whose node types change between versions.
      - name: Run tests
        run: pytest -q tests
      - name: The README's numbers match the recorded benchmark run
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == env.PYTHON_LATEST
        run: python bench/chart.py --check

  functional:
    # Its own job rather than tacked onto the end of one of the matrix jobs.
    # Building the container and driving four real shells through a terminal is
    # about a hundred seconds; run in parallel it is off the critical path,
    # run in series it *was* the critical path.
    name: Real shells, in a container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            setup.py
      - run: |
          pip install -Ur requirements.txt
          pip install -e .
      - name: Bash, Zsh, Fish and tcsh, typing into a real terminal
        run: |
          docker build -t thebleep/python3 -f tests/Dockerfile --build-arg PYTHON_VERSION=3 .
          # Not tests/functional/test_powershell.py: it pulls a 300 MB image to
          # reach PowerShell 7 on Linux, and the `powershell` job below already
          # exercises the same things in real Windows PowerShell 5.1 and 7.
          pytest -q --enable-functional tests/functional \
              --ignore=tests/functional/test_powershell.py
      - name: Nushell, and editing a correction, inside that same container
        # These drive the shell that pytest itself is running next to, so they
        # have to run *in* the image rather than attaching to it: that is the
        # only place with fish and Nushell on PATH. Each one skips when its
        # shell is missing, so a base image Nushell will not run on costs the
        # Nushell tests and nothing else.
        run: |
          docker run --rm thebleep/python3 sh -c '
              pip install --quiet pytest pytest-mock pexpect
              cd /src
              python -m pytest -q -rs \
                  tests/shells/test_edit_buffer.py \
                  tests/shells/test_nushell_real.py'

  minimum-dependencies:
    # The floors in setup.py are a claim about what works. This is the claim
    # being tested; without it they are decoration.
    name: Oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the lowest version of everything setup.py allows
        run: |
          pip install -Ur requirements.txt
          pip install --no-deps -e .
          pip install "psutil==5.9.0" "pyte==0.8.0"
          pip list
      - run: pytest -q tests

  package:
    name: Build, check and install the artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade build twine
      - run: python -m build
      - name: Check the metadata and the rendered long description
        run: python -m twine check --strict dist/*
      - name: Nothing that belongs to the repository rather than the package
        run: |
          python - <<'PY'
          import glob, sys, tarfile, zipfile
          problems = []
          wheel = glob.glob('dist/*.whl')[0]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          for unwanted in ('tests/', 'thefuck', '.egg-info/', 'bench/',
                           'assets/', '.github/', '.scratch'):
              found = [n for n in names if unwanted in n]
              if found:
                  problems.append('wheel contains %s: %s' % (unwanted, found[:3]))
          with tarfile.open(glob.glob('dist/*.tar.gz')[0]) as archive:
              sdist = archive.getnames()
          for unwanted in ('thefuck', '.scratch', 'bench/.venvs'):
              found = [n for n in sdist if unwanted in n]
              if found:
                  problems.append('sdist contains %s: %s' % (unwanted, found[:3]))
          if problems:
              print('\n'.join(problems))
              sys.exit(1)
          print('%s: %d files, clean' % (wheel, len(names)))
          PY
      - name: Install from the wheel, in a clean environment, and correct
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          export TB_SHELL=bash
          /tmp/clean/bin/thebleep --version
          /tmp/clean/bin/thebleep --alias | grep -q thebleep
          /tmp/clean/bin/thebleep --yes ehco hello | grep -q 'echo hello'
          /tmp/clean/bin/bleep 2>&1 | grep -qi "isn't configured"

  powershell:
    # We say PowerShell is supported, so the correction loop is run in a real
    # one -- in Windows PowerShell 5.1 as well as 7, because they do not agree
    # about command chaining and 5.1 has no `&&`. Half a minute each.
    name: PowerShell ${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Which PowerShell is this
        run: ${{ matrix.shell }} -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: A chained correction runs its second half
        shell: bash
        run: |
          python - > chain.ps1 <<'PY'
          from thebleep.shells import Powershell
          mark = 'New-Item -ItemType File ./MARK -Force | Out-Null'
          print(Powershell().and_("cmd /c exit 0", mark))
          print('"ran: " + (Test-Path ./MARK)')
          PY
          cat chain.ps1
      - name: ...in ${{ matrix.shell }}
        run: |
          ${{ matrix.shell }} -NoProfile -File chain.ps1 | Tee-Object -Variable out
          if ($out -notcontains "ran: True") { throw "the second half did not run" }
      - name: The alias corrects a command, and puts the environment back
        shell: bash
        run: |
          python - > loop.ps1 <<'PY'
          from thebleep.shells import Powershell
          alias = Powershell().app_alias('bleep')
          # Nothing set beforehand: it has to come back not set, and not as an
          # empty string, which is a different thing.
          print(alias)
          print('ehco it-works')
          print('bleep --yes')
          print('"unset stays unset: " + ($null -eq $env:TB_SHELL)')
          # Something set beforehand: it has to come back with that value.
          print('$env:TB_SHELL = "mine"')
          print('ehco it-works-again')
          print('bleep --yes')
          print('"set is restored: " + ($env:TB_SHELL -eq "mine")')
          print('exit')
          PY
          cat loop.ps1
      - name: ...in ${{ matrix.shell }}
        run: |
          Get-Content loop.ps1 | ${{ matrix.shell }} -NoProfile -Command - |
            Tee-Object -Variable out
          $text = $out -join "`n"
          if ($text -notmatch 'it-works') { throw "the correction did not run" }
          if ($text -notmatch 'unset stays unset: True') {
            throw "TB_SHELL was left behind, or left as an empty string" }
          if ($text -notmatch 'set is restored: True') {
            throw "TB_SHELL was not put back to what it was" }
