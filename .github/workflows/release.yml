name: Release

# Publishing happens here and nowhere else, and where it goes is decided by how
# it started rather than by anything anybody chooses at the time:
#
#   a version tag  ->  PyPI
#   run by hand    ->  TestPyPI
#
# Nothing else. There used to be a `target` input offering `pypi`, which meant a
# manual run from any branch could publish for real -- and skip the tag, version
# and changelog checks below, since those only apply to a tag. Removing the input
# removes the choice: a manual run has no way to reach PyPI.
#
# Either way the two artifacts are built once, checked, installed on Linux, macOS
# and Windows and used to correct a command, and those exact files are what gets
# uploaded -- through trusted publishing, over an OIDC token minted for this
# workflow in this repository for the length of one job. There is no API token to
# leak, and nothing on a maintainer's laptop can publish.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+"
  workflow_dispatch:

# Nothing here needs to write to the repository. The publishing job asks for the
# one permission it does need, and asks for it there rather than here.
permissions:
  contents: read

jobs:
  build:
    name: Build and check the artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: What version is this
        id: version
        run: |
          version=$(sed -n "s/^VERSION = '\(.*\)'$/\1/p" setup.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "setup.py says $version"

      - name: The tag, the version and the changelog agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${{ steps.version.outputs.version }}"
          test "$tag" = "$version" || {
            echo "tag $tag does not match setup.py's $version" >&2; exit 1; }
          head -3 CHANGELOG.md | grep -q "^## $version — " || {
            echo "CHANGELOG.md does not lead with $version" >&2; exit 1; }
          head -3 CHANGELOG.md | grep -q 'unreleased' && {
            echo "CHANGELOG.md still says unreleased" >&2; exit 1; }
          grep -q "badge/version-$version-" README.md || {
            echo "the README badge does not say $version" >&2; exit 1; }
          echo "tag, setup.py, CHANGELOG.md and the README badge all say $version"

      - name: Install the build tools
        # Pinned, like the actions above. Two builds of the same tag should
        # use the same build toolchain, and `--upgrade` guarantees they do not.
        run: pip install 'build==1.5.0' 'twine==7.0.0'

      - name: Build
        run: python -m build

      - name: Check the metadata and the rendered description
        run: python -m twine check --strict dist/*

      - name: Inspect what is in them
        run: |
          version="${{ steps.version.outputs.version }}"
          python - "$version" <<'PY'
          import sys, tarfile, zipfile
          version = sys.argv[1]
          wheel = 'dist/thebleep-%s-py3-none-any.whl' % version
          sdist = 'dist/thebleep-%s.tar.gz' % version
          problems = []

          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              entry_points = archive.read(
                  'thebleep-%s.dist-info/entry_points.txt' % version).decode()
              wheel_tags = archive.read(
                  'thebleep-%s.dist-info/WHEEL' % version).decode()

          if 'Tag: py3-none-any' not in wheel_tags:
              problems.append('the wheel is not platform independent:\n' + wheel_tags)
          for wanted in ('thebleep = thebleep.entrypoints.main:main',
                         'bleep = thebleep.entrypoints.not_configured:main'):
              if wanted not in entry_points:
                  problems.append('missing entry point: ' + wanted)
          # Nothing that belongs to the repository rather than to the package.
          def has_component(path, component):
              parts = path.rstrip('/').split('/')
              return component in parts or (
                  component == '.egg-info'
                  and any(part.endswith('.egg-info') for part in parts))
          def has_sequence(path, wanted):
              parts = path.rstrip('/').split('/')
              return any(parts[index:index + len(wanted)] == wanted
                         for index in range(len(parts) - len(wanted) + 1))
          for unwanted in ('tests', 'thefuck', '.egg-info', 'bench',
                           'assets', '.github', '.scratch'):
              found = [n for n in names if has_component(n, unwanted)]
              if found:
                  problems.append('wheel contains %s: %s' % (unwanted, found[:3]))
          if not any(n.endswith('/rules/git_add.py') for n in names):
              problems.append('the wheel has no rules in it')

          with tarfile.open(sdist) as archive:
              sdist_names = archive.getnames()
          for unwanted in ('thefuck', '.scratch', 'bench/.venvs'):
              wanted = unwanted.split('/')
              found = [n for n in sdist_names
                       if (has_component(n, unwanted) if len(wanted) == 1
                           else has_sequence(n, wanted))]
              if found:
                  problems.append('sdist contains %s: %s' % (unwanted, found[:3]))

          if problems:
              print('\n'.join(problems))
              sys.exit(1)
          print('wheel: %d files, platform independent, entry points present' % len(names))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: artifacts
          path: dist/
          if-no-files-found: error

  install:
    name: Install the built wheel (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.14"]
        # No 3.9 build for Ubuntu 26.04 (ubuntu-latest since 2026-10-19).
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: artifacts
          path: dist
      - name: Install the wheel and nothing else
        shell: bash
        run: pip install dist/thebleep-${{ needs.build.outputs.version }}-py3-none-any.whl
      - name: It runs, and it corrects something
        shell: bash
        env:
          TB_SHELL: bash
        run: |
          thebleep --version
          thebleep --alias | grep -q thebleep
          thebleep --alias-loader | grep -q thebleep
          thebleep --yes ehco hello | grep -q 'echo hello'
          echo "corrected a command from the built wheel"
      - name: --version says one line, whatever the shell
        # Not as bash: TB_SHELL above skips shell detection, and 4.0.3 went out
        # printing `[WARN] Could not determine Generic Shell version` before
        # every --version on a machine whose shell it did not recognise. Run
        # from Python, so the parent is not a shell it knows.
        shell: bash
        run: |
          python - "${{ needs.build.outputs.version }}" <<'PY'
          import os, re, subprocess, sys
          env = dict(os.environ)
          env.pop('TB_SHELL', None)
          said = subprocess.run(['thebleep', '--version'], env=env,
                                stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                universal_newlines=True).stdout.strip()
          print(said)
          lines = said.splitlines()
          if len(lines) != 1 or not re.match(
                  r'The Bleep %s using ' % re.escape(sys.argv[1]), lines[0]):
              sys.exit('--version printed more, or other, than its one line')
          PY

  tests:
    # Tests does not run on tags. It runs on the master push that went out with
    # the tag, on the same commit, and until now PyPI published without waiting
    # for it: twice a release commit went out red on Windows. This waits for
    # that run and stops the publish unless every job in it passed.
    name: The Tests run on this commit passed
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for Tests on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do
            run=$(gh run list -R "$GITHUB_REPOSITORY" -w Tests \
                    --commit "$GITHUB_SHA" -L 1 \
                    --json databaseId,status,conclusion \
                    --jq '.[0] // empty | "\(.databaseId) \(.status) \(.conclusion)"')
            echo "attempt $attempt: ${run:-no Tests run yet}"
            case "$run" in
              *" completed success") exit 0 ;;
              *" completed "*) echo "Tests did not pass: $run" >&2; exit 1 ;;
            esac
            if [ -z "$run" ] && [ "$attempt" -ge 10 ]; then
              echo "no Tests run for $GITHUB_SHA: push master with the tag" >&2
              exit 1
            fi
            sleep 30
          done
          echo "Tests did not finish in 45 minutes" >&2
          exit 1

  publish:
    name: Publish
    needs: [build, install, tests]
    runs-on: ubuntu-latest
    # A named environment so that publishing can be gated on a review, and so
    # that the trusted-publishing configuration on each index can name it. The
    # name comes from the event, which is the same thing the steps below key on.
    # In the repository's settings `pypi` accepts deployments from tags named
    # `[0-9]*.[0-9]*` and nothing else, so no branch can publish even if a
    # workflow here were changed to try.
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
      url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/p/thebleep' || 'https://pypi.org/p/thebleep' }}
    permissions:
      # The only permission this workflow asks for anywhere: minting the OIDC
      # token each index checks. No API token exists to be stolen.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: artifacts
          path: dist
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      # A tag, and only a tag. `github.event_name == 'push'` is already true only
      # for the tag globs at the top of this file; the ref is checked as well so
      # that adding a branch to those globs later cannot quietly turn a branch
      # push into a release.
      - name: Publish to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
