name: thebleep
version: stable
version-script: git -C parts/thebleep/build describe --abbrev=0 --tags
summary: Corrects your previous console command.
description: |
  The Bleep matches your previous console command against a rule, offers the
  corrected command, and runs it once you say so. The maintained successor to
  The Fuck.

grade: stable
confinement: classic

apps:
  thebleep:
    command: bin/thebleep
    environment:
        PYTHONIOENCODING: utf-8
  bleep:
    command: bin/bleep
    environment:
        PYTHONIOENCODING: utf-8

parts:
  thebleep:
    source: https://github.com/stamparm/thebleep.git
    plugin: python
