[tox]
envlist = py{39,310,311,312,313,314}

[testenv]
deps = -rrequirements.txt
commands = pytest -v --capture=sys

[flake8]
ignore = E501,W503,W504
# `exclude` replaces flake8's default list rather than adding to it, so
# every directory of somebody else's Python has to be named. `.release-venv`
# is the one `release.py` tells you to make when your interpreter cannot
# prepare a release -- without it here, following that advice makes the
# style gate lint the virtualenv it just told you to create.
exclude = venv,.venv,.release-venv,build,.tox,bench/.venvs
